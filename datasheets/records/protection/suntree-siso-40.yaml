  notes: >-
    The manufacturer's leaflet as published by the distributor Schrack (image.schrackcdn.com); Suntree's own site has no
    download. The owner saved it on 2026-10-09. One page holding the eight leaflet pages; values read from the rendered
    page (the text layer scrambles the tables). The "Identification and rating data" table and Table 1 give the same
    Ie per wiring; the 2-pole rows are the per-circuit rating when two strings share the switch (S1). Ithe 32 A in a
    dedicated IP66NW enclosure at 40 °C; 29 A outdoors at 60 °C with solar effects (derating curve on the leaflet).
    The range is offered in 10, 16, 25, 32, 40 and 50 A versions; only the 32 A version's rating table is printed.
