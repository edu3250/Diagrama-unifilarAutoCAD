  notes: >-
    Downloaded by the owner from littelfuse.com on 2026-10-08. Text extracted from the PDF text layer with pypdfium2.
    Interrupting rating from the page-1 specifications ("20 kA - 1 A - 20 A, 50 kA - 25 A - 30 A"); the page-3
    electrical table lists 20 kA for every rating and gives the 25 and 30 A clearing I2t at both 20 and 50 kA, which
    is consistent with 50 kA being their maximum. Time constant "<= 2 ms" is recorded as (0, 2). The datasheet gives
    IEC 60269-6 as an applicable standard (the gPV fuse-link standard) but does not print the word gPV. No operating
    temperature range is printed, only a derating curve (page 4).
