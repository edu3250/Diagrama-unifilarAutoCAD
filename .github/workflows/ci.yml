name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# The workflow only reads the repository: no token write scopes are needed.
permissions:
  contents: read

# A newer push to the same branch or PR supersedes the run still in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package with dev tools
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      # Tests marked "autocad" are skipped here: they need a licensed local AutoCAD 2027.
      - name: Test with coverage
        run: pytest --cov
